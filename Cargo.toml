[workspace]
resolver = "2"
members = ["crates/tf-core", "crates/tf-crypto", "crates/tf-engine", "crates/tf-store", "crates/tf-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "net", "io-util"] }

# Password hashing and crypto are painfully slow unoptimised; optimise dependencies even in dev and test.
[profile.dev.package."*"]
opt-level = 3

# Smaller debug builds: a full test build otherwise needs several GB of disk.
[profile.dev]
debug = "line-tables-only"
incremental = false

